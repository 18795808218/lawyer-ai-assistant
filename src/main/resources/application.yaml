spring:
  application:
    name: lawyer-ai-assistant

  ai:
    deepseek:
      api-key: ${DEEPSEEK_API_KEY}
      chat:
        model: deepseek-v4-flash

app:
  rag:
    splitter:
      # 每个 Chunk 的目标 Token 数量
      chunk-size: 500

      # Chunk 至少需要包含多少个字符
      min-chunk-size-chars: 200

      # 小于此长度的 Chunk 不进入后续 Embedding 流程
      min-chunk-length-to-embed: 10

      # 单个文档最多生成的 Chunk 数量
      max-num-chunks: 10000

      # 切分时是否保留标点符号
      keep-separator: true

    legal-splitter:
      # 每个 Chunk 的目标字符数
      chunk-size: 500

      # 相邻 Chunk 重叠的字符数
      chunk-overlap: 80

      # 达到目标长度后，向前寻找标点的最大范围
      boundary-search-size: 120

      # 过短的 Chunk 不保留
      min-chunk-size: 30
